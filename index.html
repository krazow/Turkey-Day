<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thanksgiving at Weird People's House</title>
<meta name="description" content="A mobile game about surviving Thanksgiving weekend at your partner's very weird family's house in Beaverton, Oregon.">
<meta name="theme-color" content="#4a2318">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thanksgiving at Weird People's House">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>@font-face{font-family:"Fraunces";src:url("fonts/fraunces-latin-600-normal.woff2") format("woff2");font-weight:600 800;font-style:normal;font-display:swap}</style>
<style>
/* ============================================================
   THEME: change these to re-skin the whole app.
   tools/new-game.py rewrites --brand-dark (also the PWA theme color).
   ============================================================ */
:root{
  --brand:#1f5d63; --brand-dark:#4a2318; --accent:#2f6d5a; --accent-soft:#6f8f5a; --surface:#f3ecdc; --paper:#fbf8f1;
  --cta:#e3642e; --cta-dark:#a9441b; --ink:#1b2326; --mute:#6b7478; --line:#ddd4c0; --good:#2f7d4f; --bad:#b8402a; --warn:#c98a12;
  /* Fraunces is self-hosted (the woff2 next to index.html, @font-face in src/shell.html); DM Sans comes from Google Fonts and is cached by sw.js after the
     first online visit. Every font-family ends in a fallback stack, so an unloaded font never drops to the browser's default serif. */
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;margin:0;background:var(--brand-dark);color:var(--ink);font-family:var(--sans);font-size:16px}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:var(--serif);margin:0}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.ghost{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.35);border-radius:14px;padding:13px;font-weight:700;font-size:16px}
.hint{font-size:13px;background:rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;line-height:1.45}
/* title */
.title{flex:1;display:flex;flex-direction:column;background:linear-gradient(var(--brand),var(--brand-dark));color:#fff}
.title .art{height:250px}
.title .art{position:relative;flex:none;overflow:hidden}
.title .body{padding:16px 20px 22px;display:flex;flex-direction:column;gap:12px}
.title h1{font-size:40px;line-height:1;letter-spacing:-.5px}
.title h1 span{display:block;font-size:17px;font-family:var(--sans);font-weight:500;letter-spacing:.3px;opacity:.85;margin-top:8px}
.title p{margin:0;line-height:1.5;opacity:.92;font-size:15px}
.title ul{margin:0;padding-left:18px;line-height:1.55;font-size:14.5px;opacity:.92}
/* "What's the game about?": the intro and bullets, folded */
.title details.about{border-radius:14px;background:rgba(255,255,255,.08)}
.title details.about summary{min-height:44px;display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:700;font-size:15.5px;cursor:pointer;list-style:none;border-radius:14px}
.title details.about summary::-webkit-details-marker{display:none}
.title details.about summary::before{content:"▸";display:inline-block;transition:transform .15s;opacity:.85}
.title details.about[open] summary::before{transform:rotate(90deg)}
.title details.about>p,.title details.about>ul{padding:0 14px 0 32px}.title details.about>p{padding-left:14px;margin-bottom:8px}
.title details.about>ul{margin-left:14px;padding:0 14px 12px 18px}
/* the other buttons: two columns; an odd one out spans both */
.title .big{text-wrap:balance}
.title .t-main{display:flex;flex-direction:column;gap:8px}
.title .t-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 14px;border-radius:14px;text-align:left;font-weight:400}
.title .t-ic{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:20px;border-radius:10px}
.title .t-tx{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.title .t-tx b{font-family:var(--serif);font-size:19px;font-weight:700}
.title .t-tx span{font-size:13px;opacity:.8}
.title .t-help{background:var(--paper);color:var(--brand-dark);border:0;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.title .t-help .t-ic{background:var(--surface)}
.title .t-feedback{background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.35)}
.title .t-feedback .t-tx span{color:rgba(255,255,255,.75)}
.title .t-help:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.title .t-inst{background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.4)}
.title .t-inst .t-ic{background:rgba(255,255,255,.14)}
.stats:has(> .stat:nth-child(6):last-child){grid-template-columns:minmax(0,1.3fr) repeat(5,minmax(0,1fr))}   /* Growing Up: six stats fill the row */
html.fs-xl .stats:has(> .stat:nth-child(6):last-child){grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:360px){.stats:has(> .stat:nth-child(6):last-child){grid-template-columns:repeat(3,minmax(0,1fr))}}
.title .t-growrow{margin-top:8px}
.title .t-grow{background:#f4d27a;color:#3a2410;border:0;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.title .t-grow .t-ic{background:rgba(255,255,255,.55)}
.title .t-grow:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.end .teaser{margin:4px 0 6px}
.title .t-btn:focus-visible{outline:3px solid #ffd27a;outline-offset:2px}
.title .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:2px}
.title .tgrid .ghost{min-height:44px;padding:6px;font-size:14px;font-weight:500;line-height:1.2;display:flex;align-items:center;justify-content:center;text-align:center;background:transparent;border-color:rgba(255,255,255,.22);border-radius:12px}
.title .tgrid .wide{grid-column:1/-1}
/* the install bar (41-install.js) at the very top */
.inst-bar{display:flex;align-items:center;gap:2px;background:#0a2a2d;color:#fff;padding:0 0 0 12px;font-size:14px;line-height:1.25;border-bottom:1px solid rgba(255,255,255,.18)}
.inst-bar .ib-t{flex:1;min-width:0}
.inst-bar .ib-go{flex:none;height:44px;min-width:44px;padding:0 14px;border:5px solid transparent;background-clip:padding-box;border-radius:15px;background-color:#fff;color:var(--brand-dark);font-weight:700;font-size:14.5px}
.inst-bar .ib-x{flex:none;width:44px;height:44px;border:0;background:transparent;color:#fff;font-size:18px;border-radius:10px}
.big{background:var(--cta);color:#fff;border:0;border-radius:14px;padding:16px;font-weight:700;font-size:18px;box-shadow:0 4px 0 var(--cta-dark)}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 var(--cta-dark)}
.small-note{font-size:12px;opacity:.7}
.heat-note,.hunger-note{color:var(--bad);opacity:1;margin:8px 0 0}
/* hud */
.hud{background:var(--brand-dark);color:#fff;padding:10px 14px 10px;position:sticky;top:0;z-index:5}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hud-right{display:flex;align-items:center;gap:8px;flex:none}
.hud-day{font-family:var(--serif);font-size:20px;font-weight:800}
.hud-time{white-space:nowrap;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.hud-sub{font-size:12px;opacity:.75;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:minmax(0,1.45fr) repeat(6,minmax(0,1fr));gap:4px;margin-top:8px}   /* Cash is the widest */
.stat b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.fs-xl .stats{grid-template-columns:repeat(4,minmax(0,1fr))}   /* large text: two rows of four, so no value wraps or clips */
@media (max-width:360px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:rgba(255,255,255,.08);border-radius:9px;padding:5px 2px 6px;text-align:center}
.stat b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.stat small{font-size:10px;opacity:.75;text-transform:uppercase;letter-spacing:.5px}
.meter{height:4px;border-radius:2px;background:rgba(255,255,255,.15);margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%}
/* scene */
.scene{position:relative;height:170px;overflow:hidden}
.scene svg{display:block;width:100%;height:100%}
.place{position:absolute;left:12px;bottom:10px;background:rgba(251,248,241,.94);border-radius:10px;padding:6px 10px;max-width:80%}
.place h2{font-size:18px}
.place div{font-size:12px;color:var(--mute)}
@media (max-width:480px){.place div{display:-webkit-box;-webkit-line-clamp:1;line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}}   /* one line on a phone, so the scene's signs show */
.alertbar{background:var(--bad);color:#fff;font-size:13px;padding:8px 14px;font-weight:500}
.alertbar.fog{background:#6c7a80}
/* content */
.content{flex:1;padding:12px 14px 90px}
.narr{background:var(--surface);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.45;margin-bottom:12px}
.narr p{margin:0 0 6px}.narr p:last-child{margin:0}
.sect{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);margin:14px 2px 6px;font-weight:700}
.act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;color:var(--ink)}
.act:active{background:var(--surface)}
.act .ic{font-size:22px;width:30px;text-align:center;flex:none}
.act .tx{flex:1;min-width:0}
.act .tx b{display:block;font-weight:700;font-size:15px}
.act .tx span{display:block;font-size:12.5px;color:var(--mute);margin-top:1px}
.act.primary{border-color:var(--accent);background:#eef4ee}
.act.danger{border-color:#e2b3a7}
.act[disabled]{opacity:.45}
.dest{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.dest .dn{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dest .dn b{font-size:15px}.dest .dn span{font-size:11.5px;color:var(--mute);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1.5px solid var(--accent);color:var(--accent);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700}
.chip:active{background:#e3eee5}
.chip[disabled]{border-color:var(--line);color:#aaa}
/* tabs */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{background:none;border:0;padding:9px 0 10px;font-size:11px;color:var(--mute);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button .ti{font-size:20px}
.tabs button.on{color:var(--brand)}
.tabs .dot{display:inline-block;width:7px;height:7px;background:var(--bad);border-radius:50%;margin-left:3px;vertical-align:top}
/* to-do, priorities, log */
.rules{font-size:13px;line-height:1.5;color:var(--ink);background:var(--surface);border-radius:10px;padding:10px 12px;margin-top:12px}
.rules p{margin:0 0 6px}
.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.todo .ck{font-size:20px;width:26px;flex:none;text-align:center}
.todo b{display:block;font-size:15px}.todo span{font-size:12.5px;color:var(--mute)}
.todo .pin{margin-left:auto;flex:none;border:1px solid var(--line);background:none;border-radius:8px;padding:4px 7px;font-size:13px;color:var(--mute);cursor:pointer}
.prio{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prio .rk{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink,#2a3d45);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.prio.done .rk{background:var(--line);color:var(--mute)}
.prio .pt{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere;cursor:pointer}
.prio.done .pt{text-decoration:line-through;color:var(--mute)}
.prio .pb{display:flex;gap:4px;flex:none}
.prio .pb button,.prio-add button{border:1px solid var(--line);background:none;border-radius:8px;min-width:32px;height:32px;font-size:14px;cursor:pointer;color:inherit}
.prio .pb button:disabled{opacity:.3;cursor:default}
.prio-add{display:flex;gap:6px;margin:8px 0 2px}
.prio-add input{flex:1;min-width:0;font:inherit;font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit}
.prio-add button{padding:0 12px;font-weight:700}
.prio-empty{font-size:13px;color:var(--mute);padding:6px 2px}
.log p{margin:0;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.4}
.log p em{font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums;margin-right:6px;font-size:12px}
/* event tiles (toasts) */
#tiles{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 150px);width:calc(100% - 20px);max-width:460px;z-index:15;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.tile{pointer-events:auto;display:flex;align-items:center;gap:11px;background:#fffdf8;border-radius:14px;padding:10px 10px 10px 12px;box-shadow:0 8px 24px rgba(8,25,30,.28),0 1px 0 rgba(0,0,0,.05);border-left:6px solid #6b7478;animation:tileIn .32s cubic-bezier(.2,.9,.3,1.2)}
.tile.good{border-left-color:var(--good)}.tile.bad{border-left-color:var(--bad)}.tile.info{border-left-color:var(--brand)}.tile.warn{border-left-color:var(--warn)}
.tile .ti{font-size:26px;width:32px;text-align:center;flex:none}
.tile .tt{flex:1;min-width:0}
.tile .tt small{display:block;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;font-weight:700;color:var(--mute)}
.tile .tt b{display:block;font-size:15px;line-height:1.25}
.tile .tt span{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.tile .ok{flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:17px;color:var(--accent);font-weight:700}
.tile.out{animation:tileOut .25s ease-in forwards}
/* tiles sit under pop-ups (z 20) and transitions (z 30), and hide while one is open: they come back when it closes (02-kit.js) */
body:has(> #mbg) #tiles,body:has(> .cross) #tiles{visibility:hidden}
body:has(> #mbg) #tiles .tile,body:has(> .cross) #tiles .tile{pointer-events:none}
@keyframes tileIn{from{transform:translateY(-16px) scale(.96);opacity:0}}
@keyframes tileOut{to{transform:translateY(-12px);opacity:0;height:0;margin:0;padding-top:0;padding-bottom:0}}
.gear{background:rgba(255,255,255,.12);border:0;border-radius:10px;width:38px;height:38px;font-size:19px;color:#fff;flex:none}
.title{position:relative}.tgear{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px;background:rgba(18,49,59,.55);border:0;border-radius:12px;width:44px;height:44px;font-size:21px;z-index:2}
.nm-in{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.nm-in:focus{outline:2px solid var(--accent);border-color:var(--accent)}
/* grouped actions, collapsible destinations, tips */
details.go{margin-top:14px}
.gohood{font-size:12px;font-weight:700;color:var(--ink,#1d3346);margin:12px 2px 6px;display:flex;justify-content:space-between;align-items:baseline}.gohood span{font-weight:500;font-size:11px;color:var(--mute)}
details.go>summary{list-style:none;cursor:pointer;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);font-weight:700;padding:8px 2px;display:flex;justify-content:space-between}
details.go>summary::-webkit-details-marker{display:none}
details.go>summary::after{content:'▸ show';letter-spacing:.3px;text-transform:none}
details.go[open]>summary::after{content:'▾ hide'}
.dest.compact{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px}
.dest.compact .dn{flex:1 1 150px;display:block}
.dest.compact .dn span{display:block;text-align:left}
.dest.compact .chips{margin-top:0}
.tip{background:#fff5d6;border:1.5px solid #e6c97a;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;line-height:1.45}
.tip .tb{display:flex;gap:8px;margin-top:8px}
.tip button{border:1.5px solid #c9a24a;background:#fff;border-radius:9px;padding:6px 10px;font-weight:700;font-size:13px;color:#6b4e0e}
/* accessibility */
html.fs-l{zoom:1.12}html.fs-xl{zoom:1.25}
html.hc{--mute:#2b3336;--line:#7d7462;--paper:#ffffff;--surface:#efe5cc}
html.hc .hud-sub,html.hc .stat small{opacity:1}html.hc .act,html.hc .dest{border-width:2px}
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important}
.today{background:#eef3f4;border-radius:10px;padding:9px 11px;margin-bottom:10px;font-size:13.5px;line-height:1.55}
.today b{display:block;font-family:var(--serif);font-size:15px;margin-bottom:2px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,25,30,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:var(--paper);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.modal h2{font-size:22px;margin-bottom:8px}
.modal .mb{font-size:15px;line-height:1.5;margin-bottom:14px}
.modal .mb p{margin:0 0 8px}
.modal .act{margin-bottom:8px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface);color:var(--ink);margin:0 4px 4px 0}
.tag.bad{background:#f6ddd5;color:var(--bad)}.tag.good{background:#dcefe2;color:var(--good)}
/* full-screen transition (travel, sleep…) */
.cross{position:fixed;inset:0;z-index:30;background:var(--brand-dark);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.cross svg{width:100%;max-width:480px;height:260px}
.cross .cap{font-family:var(--serif);font-size:22px;margin-top:6px;text-align:center;padding:0 20px}
.cross .cap2{font-size:13px;opacity:.75;margin-top:6px}
.bob{animation:bob 1.2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(3px)}}
/* end */
.end{padding:22px 18px 40px}
.end h1{font-size:30px;margin:6px 0 4px}
.grade{font-family:var(--serif);font-size:58px;font-weight:800;color:var(--cta);line-height:1}
.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv>span{flex:0 0 auto}.kv>b{text-align:right}
.kv b{font-variant-numeric:tabular-nums}
/* polish */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--cta);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
html.hc :focus-visible{outline:3px solid #000;outline-offset:0;box-shadow:0 0 0 7px #ffd400}
html.hc .hud :focus-visible,html.hc .title :focus-visible,html.hc nav.tabs :focus-visible{outline-color:#ffd400;box-shadow:0 0 0 7px #000}
.cross:focus-visible{outline:4px solid var(--cta);outline-offset:-8px}
.prio .pt[role="button"]{cursor:pointer;border-radius:6px}
/* ⌨️ keyboard shortcut hints (desktop only) */
.kn{display:none}
@media (pointer:coarse),(any-pointer:coarse) and (hover:none){.kn{display:none!important}}
@media (hover:hover) and (pointer:fine){
  button.act{position:relative}

.gear,.tile .ok{width:44px;height:44px}

.packopt b{font-size:14px}.packopt span{font-size:12px;color:var(--mute)}
.packopt.on{border-color:var(--accent,#2f7d8a);box-shadow:inset 0 0 0 1px var(--accent,#2f7d8a);background:rgba(47,125,138,.12)}

.req .rb p{margin:0 0 8px;font-size:14.5px}

.digest .dig .di{font-size:22px;line-height:1.2}
.digest .dig p{margin:3px 0 0;font-size:14px}
.digest .sect{margin-top:10px}

/* illustrations (40-art.js; art/README.md "How pictures are shown"). The 16:9 art is cropped to a banner whose height is reserved
   before the image arrives (no layout shift): half the column's width (2:1), at most 30% of the screen's height so the text and the
   buttons stay in view; 16:9 on tall, wide screens (tablets). The placeholder is the picture's own average color (inline), the image
   fades in once decoded (not with reduced motion, and not again on a redraw), and a picture that can't load takes its box away. */
:root{--art-w:min(100vw,480px);--art-h:min(calc(var(--art-w) * .5),30vh)}
@media (min-width:600px) and (min-height:900px){:root{--art-h:min(calc(var(--art-w) * .5625),30vh)}}
.art-fig{margin:0 0 10px;border-radius:12px;overflow:hidden;aspect-ratio:2/1;max-height:30vh;background:#cfdfe3}
.art-fig picture{display:contents}
.art-fig img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s ease-out}
.art-fig[data-ld] img{opacity:1}
.art-fig[data-err]{display:none}
/* a sheet: a full-bleed banner above the title (02-kit.js sheetHTML lifts it there) */
.modal>.art-fig:first-child{margin:-20px -18px 14px;border-radius:0;aspect-ratio:auto;max-height:none;height:var(--art-h)}
/* a tab: the picture takes the drawn scene's place, at the banner's height; the place's name moves to the sky, one line */
.scene>.art-fig{position:absolute;inset:0;margin:0;border-radius:0;aspect-ratio:auto;max-height:none;height:100%}
.scene:has(>.art-fig:not([data-err])){height:var(--art-h)}
.scene:has(>.art-fig:not([data-err])) .place{top:10px;bottom:auto;padding:4px 10px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.scene:has(>.art-fig:not([data-err])) .place h2{font-size:16px}.scene:has(>.art-fig:not([data-err])) .place div{display:none}
@media (prefers-reduced-motion:reduce){.art-fig img{transition:none}}
@media (prefers-color-scheme:dark){.art-fig{background:#22313a;filter:brightness(.86) saturate(.95)}}
/* ❓ Help: the player's guide (26-help.js), a full-screen document over the game */
html.tut-open,html.tut-open body{overflow:hidden}
.tut{position:fixed;inset:0;z-index:18;overflow-y:auto;overscroll-behavior:contain;background:var(--paper);color:var(--ink);-webkit-overflow-scrolling:touch}
.tut:focus{outline:none}
.tut-bar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--brand-dark);color:#fff}
.tut-bar button{min-height:44px;padding:0 14px;border-radius:12px;font-weight:700;font-size:15px}
.tut-x{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4)}
.tut-pr{background:var(--paper);color:var(--brand-dark);border:0}
.tut-bar button:focus-visible{outline:3px solid #ffd27a;outline-offset:2px}
.tut-doc{max-width:640px;margin:0 auto;padding:22px 20px calc(env(safe-area-inset-bottom) + 40px);font-size:16px;line-height:1.6}
.tut-cover svg{display:block;width:100%;height:auto;margin-bottom:16px}
.tut-cover h1{font-size:34px;line-height:1.05;letter-spacing:-.4px;color:var(--brand-dark);margin:0 0 10px;text-wrap:balance}
.tut-lede{font-size:18px;line-height:1.5;margin:0 0 6px;color:#33403f}
.tut-small{font-size:13.5px;color:var(--mute);line-height:1.5}
.tut-doc p{margin:0 0 12px}
.tut-toc{margin:22px 0 8px;padding:16px 16px 8px;background:var(--surface);border-radius:14px}
.tut-toc:focus{outline:none}.tut-toc:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.tut-toc h2{font-size:20px;margin:0 0 4px;color:var(--brand-dark)}
.tut-toc ol{list-style:none;margin:0;padding:0}
.tut-toc a{display:flex;align-items:center;gap:12px;min-height:44px;color:var(--ink);text-decoration:none;font-weight:500;border-bottom:1px solid var(--line);line-height:1.25}
.tut-toc li:last-child a{border-bottom:0}
.tut-toc a:hover{color:var(--brand)}
.tut-toc a:focus-visible,.tut-up:focus-visible,.tut-doc .linkbtn:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.tut-tn{flex:none;width:28px;font-family:var(--serif);font-weight:700;font-size:17px;color:var(--cta-dark);text-align:right;font-variant-numeric:tabular-nums}
.tut-ch{padding:26px 0 8px;border-top:2px solid var(--brand-dark);margin-top:26px;scroll-margin-top:calc(env(safe-area-inset-top) + 64px)}
.tut-ch>h2{display:flex;align-items:baseline;gap:12px;font-size:26px;line-height:1.15;color:var(--brand-dark);margin:0 0 14px}
.tut-ch>h2:focus{outline:none}.tut-ch>h2:focus-visible{outline:2px solid var(--brand);outline-offset:4px}
.tut-n{flex:none;font-size:40px;line-height:.9;color:var(--cta);font-variant-numeric:tabular-nums}
.tut-ch h3{font-size:18px;margin:20px 0 8px;color:var(--brand-dark)}
.tut-ch ul,.tut-ch ol{margin:0 0 12px;padding-left:22px}
.tut-ch li{margin:0 0 6px}
.tut-steps{counter-reset:st;list-style:none;padding-left:0!important}
.tut-steps li{counter-increment:st;position:relative;padding-left:40px;margin-bottom:10px}
.tut-steps li::before{content:counter(st);position:absolute;left:0;top:1px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.tut-place{padding-left:12px;border-left:3px solid var(--line)}
.tut-box{margin:16px 0;padding:12px 14px;border-radius:12px;background:#eaf1ea;border-left:5px solid var(--good)}
.tut-box.warn{background:#f8e9e2;border-left-color:var(--bad)}
.tut-box b{display:block;font-family:var(--serif);font-size:16px;margin-bottom:2px}
.tut-box p{margin:0!important;font-size:15px;line-height:1.5}
.tut-fig{margin:14px 0 18px}
.tut-fig svg{display:block;width:100%;height:auto}
.tut-fig figcaption{font-size:13px;color:var(--mute);margin-top:6px}
.tut-tw{overflow-x:auto;margin:0 0 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.tut-t{border-collapse:collapse;width:100%;font-size:14px;line-height:1.4}
.tut-t th,.tut-t td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tut-t thead th{background:var(--surface);font-size:13px;color:#4a5457;font-weight:700;white-space:nowrap}
.tut-t tbody th{font-weight:700}
.tut-t tbody:last-child tr:last-child>*{border-bottom:0}
.tut-t .tut-grp th{background:#eef1ea;color:var(--brand-dark);font-family:var(--serif);font-size:15px}
.tut-acts td:nth-child(2){white-space:nowrap}
.tut-acts tbody th{font-weight:500}
.tut-formula{font-family:var(--serif);font-size:18px;line-height:1.4;padding:14px 16px;margin:0 0 14px;background:var(--brand-dark);color:#fff;border-radius:12px;text-align:center}
.tut-cols{columns:2;column-gap:20px;font-size:14.5px}.tut-cols li{break-inside:avoid}
@media (max-width:420px){.tut-cols{columns:1}}
.tut-faq dt{font-weight:700;font-family:var(--serif);font-size:17px;margin:14px 0 4px}
.tut-faq dd{margin:0 0 8px}
.tut-up{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:700;color:var(--brand);text-decoration:none}
.tut-foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
@media (prefers-color-scheme:dark){.tut-t{background:#fff}}
@media print{
  @page{margin:16mm 14mm}
  html,body{background:#fff!important;overflow:visible!important;height:auto!important}
  html.tut-open #app,html.tut-open .modal-bg,html.tut-open #tiles,html.tut-open .inst-toast{display:none!important}
  .tut{position:static;overflow:visible;inset:auto;background:#fff}
  .tut-bar,.tut-up,.tut-doc .linkbtn{display:none!important}
  .tut-doc{max-width:none;padding:0;font-size:11pt;line-height:1.45}
  .tut-toc{background:none;border:1px solid #bbb}
  .tut-toc a{min-height:0;padding:3px 0}
  .tut-ch{break-before:auto;margin-top:14pt;padding-top:10pt}
  .tut-ch>h2,.tut-ch h3{break-after:avoid}
  .tut-box,.tut-fig,.tut-tw,.tut-formula,tr{break-inside:avoid}
  .tut-tw{overflow:visible}
  .tut-formula{background:none;color:#000;border:1.5px solid #000}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* Install app (41-install.js): the steps sheet and the thank-you note */
.inst-steps{margin:8px 0 10px;padding-left:22px;line-height:1.5;font-size:15px}.inst-steps li{margin:4px 0}

.wn-sum{color:var(--mute);font-size:14px}

.wn-ver h3{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-family:var(--serif);font-size:18px;margin:10px 0 4px}
.wn-ver h3:focus{outline:none}.wn-ver h3:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wn-ver ul{margin:0;padding-left:20px}.wn-ver li{margin-bottom:6px}

.wn-tag{font-family:var(--sans);font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:2px 9px;align-self:center}

.wn-older{margin-top:6px}

.linkbtn{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;background:none;border:0;font:inherit;font-weight:700;color:var(--brand);text-decoration:underline;cursor:pointer}

/* phone: messages */

/* phone: calls */

.ph-call{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:10px 0 6px}

.ph-ringing .ph-call-av{animation:phRing 1s ease-in-out infinite}html.rm .ph-ringing .ph-call-av{animation:none}
@keyframes phRing{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}}

/* phone: Transit, Maps, Weather, Rides (54-phone-travel.js) */

/* 📱 Growing Up phone (57-phone-grow.js): the 9 PM lock screen, the rules, the screen-time meter */

/* start screen: sections and half-width cards */

<body>
<div id="app"></div>
<noscript><p style="color:#fff;padding:20px;font-family:sans-serif">This game needs JavaScript.</p></noscript>
<script>
// ============================================================
//  GAME CONFIG: start here when you make a new game.
//  tools/new-game.py rewrites id / title / codePrefix / colors for you
//  (in this file, src/shell.html, the web manifest and sw.js).
//
//  Files, in build order (tools/build.py concatenates src/js/*.js by name):
//    00-game.js      this config
//    01-core.js      state, preferences, sound, player name, time + stat helpers
//    02-kit.js       bottom-sheet modals, event tiles, full-screen transitions
//    03-events.js    random-event engine (hooks, chances, cooldowns, chains)
//    04-loop.js      new game, days, nights, travel, the passing of time
//    05-ui.js        HUD, scene, tabs, action list, to-do + priorities, log, tips
//    06-save.js      autosave, 3 slots, migrations, transfer codes, service worker
//    07-endings.js   end screen, score, best score, achievements
//    08-settings.js  title screen, name/difficulty pickers, settings, accessibility, slots
//    09-keys.js      keyboard shortcuts for desktop
//    20-world.js     ← YOUR GAME: stats, starting state, the places, chores, actions, scenery
//    21-story.js     ← YOUR GAME: the job pick, events, tips, to-do, neighbors, achievements, scoring, migrations
//    26-help.js      the Help sheet
//    29-update-notice.js  the "updated to version X" notice and What's new
//    41-install.js   the title screen's install bar and Install app button (Android/Chrome prompt, other browsers' steps, iPhone page)
//    99-boot.js      starts the app
//  Engine files (00–09) shouldn't need much editing; your game lives in 20+.
// ============================================================
const GAME={
  id:'turkeyday',           // storage-key prefix and service-worker cache prefix (lowercase, no spaces)
  title:'Thanksgiving at Weird People\'s House',
  tagline:'Survive the holiday weekend with your partner\'s very strange family in Beaverton, OR',
  codePrefix:'TURKEYDAY',   // transfer codes start with this
  version:'0.1.0',          // bump on every release: shown in Settings, stamped into saves and sw.js
  schema:1,                 // bump when the shape of S changes, and add a MIGRATIONS entry (21-story.js)
  days:5,                   // Wed Nov 25 – Sun Nov 29, 2026: Thanksgiving weekend at the Pembertons' in Beaverton
  wake:480,                 // 8:00 AM (day one's arrival time is set by onNewGame)
  startLoc:'guest',
  travelAnim:20,            // trips this many minutes or longer play the full-screen transition
  defaultName:'Guest',      // used until the player picks a name
  slots:3,                  // save slots
};
const APP_VERSION=GAME.version, SAVE_SCHEMA=GAME.schema;
const KEY=k=>GAME.id+'.'+k;  // every localStorage key goes through this
// day 0 is Wednesday Nov 25, 2026 (the engine names day d as DAYS[d%7])
const DAYS=['Wednesday','Thursday','Friday','Saturday','Sunday','Monday','Tuesday'];
// Difficulties: anything here is readable in your content as DF().something.
const DIFFS={
  // money: starting cash. bad: bad-event multiplier. cost: store prices. strain: stress multiplier on weird moments. No difficulty changes the score.
  easy:  {n:'Normal-ish Family',ic:'🥧',d:'A little weird. More cash, cheaper pie, and the family forgives a lot.',money:400,bad:0.6,cost:0.85,strain:0.75},
  normal:{n:'The Pembertons',   ic:'🦃',d:'Exactly as weird as Riley warned you. Possibly more.',money:250,bad:1,cost:1,strain:1},
  hard:  {n:'Full Pemberton',   ic:'🔥',d:'Grandma is keeping score, Uncle Dez has a new theory, and your wallet is thin. Same score, harder weekend.',money:120,bad:1.4,cost:1.2,strain:1.3},
};
const DF=()=>DIFFS[(typeof S!=='undefined'&&S&&S.diff)||'normal']||DIFFS.normal;
// ---------------- state ----------------
// S is the whole saved game. Anything you put in S is saved, loaded and transferred automatically.
// tab is the open tab; uiNarr is the narration shown at the top of the Here tab (cleared on each tap).
let S, tab='act', uiNarr=[];

// ---------------- preferences (device-wide, not per save) ----------------
const PREF_KEY=KEY('prefs');
const PREF_DEF={fs:'n',hc:false,rm:(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})(),sound:true,tips:true,diff:'normal',goOpen:null,tripSteps:false};
function prefs(){try{return Object.assign({},PREF_DEF,JSON.parse(localStorage.getItem(PREF_KEY)||'{}'))}catch(e){return Object.assign({},PREF_DEF)}}
function setPref(k,v){const p=prefs();p[k]=v;try{localStorage.setItem(PREF_KEY,JSON.stringify(p))}catch(e){}applyPrefs()}
function applyPrefs(){const p=prefs(),c=document.documentElement.classList;c.toggle('fs-l',p.fs==='l');c.toggle('fs-xl',p.fs==='xl');c.toggle('hc',!!p.hc);c.toggle('rm',!!p.rm)}

// ---------------- sound (synthesized with Web Audio: no files to ship) ----------------
let AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function tone(f,dur,type,vol,when,slide){const a=audio();if(!a)return;const t=a.currentTime+(when||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+0.05)}
// Add your own named sounds here.
const SFX={
  good:()=>{tone(784,0.18,'sine',0.09);tone(1175,0.28,'sine',0.07,0.12)},
  bad: ()=>{tone(233,0.22,'triangle',0.12);tone(175,0.35,'triangle',0.1,0.15)},
  info:()=>tone(660,0.16,'sine',0.06),
  win: ()=>[523,659,784,1046].forEach((f,i)=>tone(f,0.28,'sine',0.09,i*0.1)),
  tap: ()=>tone(520,0.05,'sine',0.03),
  whoosh:()=>tone(300,0.6,'triangle',0.05,0,900),
  horn:()=>{tone(110,1.5,'triangle',0.16);tone(138.6,1.5,'triangle',0.12);tone(220,1.5,'sine',0.04)},
};
function sfx(n){if(!prefs().sound||!SFX[n])return;try{SFX[n]()}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

// ---------------- player name ----------------
// Any text can contain {{name}}. It's swapped in only when shown, so renaming updates every line already in the log.
const NAME_KEY=KEY('name');
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function profileName(){try{return localStorage.getItem(NAME_KEY)||''}catch(e){return ''}}
function currentName(){return (typeof S!=='undefined'&&S&&S.name)||profileName()||GAME.defaultName}
function withName(t){return typeof t==='string'?t.replace(/\{\{name\}\}/g,esc(currentName())):t}
function cleanName(raw){const n=String(raw||'').replace(/\s+/g,' ').trim();
  if(!n) return {err:'Please enter a name.'};
  if(n.length>20) return {err:'Keep it to 20 characters or fewer.'};
  if(!/^[\p{L}\p{N}][\p{L}\p{N} '’.\-]*$/u.test(n)) return {err:'Letters, numbers, spaces, apostrophes, periods and hyphens only.'};
  return {name:n}}
function setPlayerName(n){
  const old=currentName();
  try{localStorage.setItem(NAME_KEY,n)}catch(e){}
  if(S&&!S.over){S.name=n;if(old!==n)say('✏️ From now on, everyone calls you {{name}}.');saveGame()}
  else{ // on the title screen: rename the saved game too, so Continue uses the new name
    const ls=store();if(ls)try{for(const k of slotKeys()){const v=ls.getItem(k);if(!v)continue;const d=JSON.parse(v);if(d&&d.S){d.S.name=n;ls.setItem(k,JSON.stringify(d))}}}catch(e){}
    if(S&&S.over) S.name=n}
}

// ---------------- time ----------------
// S.t is minutes since the start of the run (day 0, midnight). S.cur is the current day index.
const day=()=>S.cur;
const tod=()=>S.t-S.cur*1440;                       // minutes since midnight today
const dayName=d=>DAYS[((d%7)+7)%7];
function fmt(m){m=((m%1440)+1440)%1440;let h=Math.floor(m/60),mi=m%60;const ap=h<12?'AM':'PM';h=h%12||12;return h+':'+String(mi).padStart(2,'0')+' '+ap}
function fmtAbs(a){const d=Math.floor(a/1440);return (d!==day()?dayName(d).slice(0,3)+' ':'')+fmt(a)}

// ---------------- helpers for content ----------------
function say(s){uiNarr.push(s);S.log.push({t:S.t,s})}              // narrate + log
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function adj(k,v,lo=0,hi=100){S[k]=clamp(Math.round(S[k]+v),lo,hi)} // nudge a 0–100 stat
function money(v){S.money=Math.round((S.money+v)*100)/100}
// Numbers with thousands separators; $() is the one money formatter (cents only when there are some): $47,975, −$1,200, $6.19.
const grp=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const $=x=>{const f=(Math.round(Math.abs(x)*100)/100).toFixed(x%1?2:0).split('.');f[0]=grp(+f[0]);return (x<0?'−':'')+'$'+f.join('.')};
const $k=x=>Math.abs(x)>=10000?(x<0?'−':'')+'$'+Math.round(Math.abs(x)/1000)+'k':$(x);   // compact money for tight spots (the top bar): $48k
const pick=a=>a[Math.floor(Math.random()*a.length)];
function isOpen(id,t=S.t){const h=L[id].hours;if(!h)return true;const r=h(Math.floor(t/1440));if(!r)return false;const m=t%1440;return m>=r[0]&&m<r[1]}
function hoursTxt(id){const h=L[id].hours;if(!h)return '';const r=h(day());return r?`Open ${fmt(r[0])}–${fmt(r[1])}`:'Closed today'}
// ---------------- bottom-sheet modal ----------------
// modal(title, bodyHtml, [{l:'Label', s:'subtitle', fn:()=>{}, dis:false}, …])
// The first enabled button is highlighted (unless it has np:true; dilemma choices do, so no option is the "right" one).
// A button may carry legal:true/false, written to its data-legal attribute. Modals opened while one is showing are queued and shown in order.
// A 4th argument true makes the pop-up required: Esc doesn't close it, only its own button does (no backdrop-tap close exists).
// After any button, the game re-renders (unless you're on the title or end screen).
let MB=[], MQ=[], FOCUS_RET=null;
let DIGEST=null;   // the morning report being collected (04-loop.js endDay): {night, items, lines, held}
// Keyboard and screen-reader behavior: while a pop-up is open the page behind it is inert and Tab stays inside the pop-up;
// Esc closes it unless it is required (a 4th argument of true); closing gives focus back to what you had pressed.
const FOCUSABLE='button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])';
function focusKey(el){if(!el||el===document.body||!el.tagName)return null;const tag=el.tagName.toLowerCase();return {id:el.id||'',tag,txt:(el.textContent||'').trim().slice(0,80),idx:[...document.querySelectorAll(tag)].indexOf(el)}}
function focusBack(k){if(!k)return;
  let el=k.id?document.getElementById(k.id):null;
  if(!el){const all=[...document.querySelectorAll(k.tag)].filter(e=>!e.closest('#mbg'));el=all.find(e=>(e.textContent||'').trim().slice(0,80)===k.txt)||all[k.idx]}
  if(el&&!el.disabled&&el.offsetParent!==null){try{el.focus({preventScroll:true})}catch(e){}}}
function syncInert(){const a=document.getElementById('app'),on=!!document.getElementById('mbg');if(a){if(on)a.setAttribute('inert','');else a.removeAttribute('inert')}}
// The pop-up's inner HTML (shared by modal() and modalSwap())
// An illustration that opens the body (40-art.js) is lifted above the title: a full-bleed banner across the top of the sheet.
function sheetHTML(title,body,btns){let fig='';if(body.startsWith('<figure class="art-fig"')){const k=body.indexOf('</figure>')+9;fig=body.slice(0,k);body=body.slice(k)}
  return withName(`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title.replace(/<[^>]+>/g,''))}" tabindex="-1">${fig}<h2>${title}</h2><div class="mb">${body}</div>${btns.map((b,i)=>`<button class="act ${i===0&&!b.dis&&!b.np?'primary':''}" ${b.legal!==undefined?`data-legal="${b.legal}"`:''} ${b.dis?'disabled':''} onclick="MBTN(${i})"><span class="tx"><b>${b.l}</b>${b.s?'<span>'+b.s+'</span>':''}</span></button>`).join('')}</div>`)}
// A button with stay:true keeps the pop-up on screen while its fn runs: if fn calls modalSwap(), the same sheet shows the next step in place
// (one pop-up for a whole trip, say); if it doesn't, the sheet closes as usual.
let SWAPOK=false,SWAPPED=false;
function modalSwap(title,body,btns,noClose){
  const el=document.getElementById('mbg');
  if(!(SWAPOK&&el)) return modal(title,body,btns,noClose);
  MB=btns;SWAPPED=true;
  if(noClose)el.dataset.lock='1';else delete el.dataset.lock;
  el.innerHTML=sheetHTML(title,body,btns);
  const m=el.querySelector('.modal');if(m){m.classList.add('swap');m.scrollTop=0}
  setTimeout(()=>{const m2=el.querySelector('.modal'),b=el.querySelector('button.act:not([disabled])');if(!document.body.contains(el))return;
    if(b&&!el.querySelector('input,textarea'))b.focus({preventScroll:true});else if(m2)m2.focus({preventScroll:true})},30);
}
window.modalSwap=modalSwap;
function modal(title,body,btns,noClose){
  if(DIGEST&&!DIGEST.open){DIGEST.held.push([title,body,btns,noClose]);return}   // while the morning report is being put together, pop-ups wait behind it
  if(document.getElementById('mbg')){MQ.push([title,body,btns,noClose]);return}
  MB=btns;
  if(!FOCUS_RET)FOCUS_RET=focusKey(document.activeElement)||{};
  const el=document.createElement('div');el.className='modal-bg';el.id='mbg';if(noClose)el.dataset.lock='1';
  el.innerHTML=sheetHTML(title,body,btns);
  el.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.preventDefault();e.stopPropagation();escModal();return}
    if(e.key!=='Tab')return;
    const f=[...el.querySelectorAll(FOCUSABLE)].filter(x=>x.offsetParent!==null||x===document.activeElement);
    if(!f.length){e.preventDefault();el.querySelector('.modal').focus();return}
    const first=f[0],last=f[f.length-1],cur=document.activeElement;
    if(!el.contains(cur)||cur===el.querySelector('.modal')){e.preventDefault();(e.shiftKey?last:first).focus();return}
    if(e.shiftKey&&cur===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&cur===last){e.preventDefault();first.focus()}});
  document.body.appendChild(el);syncInert();
  setTimeout(()=>{const m=el.querySelector('.modal'),b=el.querySelector('button.act:not([disabled])');if(!document.body.contains(el))return;
    if(b&&!el.querySelector('input,textarea'))b.focus({preventScroll:true});else if(!el.contains(document.activeElement)&&m)m.focus({preventScroll:true})},30);
}
// after a pop-up closes: show the next queued one, else redraw and give focus back
function modalClosed(){
  if(!document.getElementById('mbg')&&MQ.length&&S&&!S.over){const q=MQ.shift();modal(...q)}
  if(S&&!S.over&&!document.querySelector('.title,.end'))render();
  syncInert();
  if(!document.getElementById('mbg')){const k=FOCUS_RET;FOCUS_RET=null;focusBack(k);tileFlush()}
}
window.MBTN=i=>{const b=MB[i];if(b&&b.dis)return;const el=document.getElementById('mbg');
  if(b&&b.stay&&el){SWAPOK=true;SWAPPED=false;try{b.fn&&b.fn()}finally{SWAPOK=false;if(!SWAPPED){const e2=document.getElementById('mbg');e2&&e2.remove()}}modalClosed();return}
  el&&el.remove();const f=b&&b.fn;f&&f();modalClosed()};
// Esc: press the pop-up's own close button if it has one (or its only button); otherwise just put it away. Required pop-ups ignore it.
function escModal(){
  const el=document.getElementById('mbg');if(!el||el.dataset.lock)return false;
  const bs=[...el.querySelectorAll('.modal > button.act')].filter(b=>!b.disabled);
  const c=[...bs].reverse().find(x=>/^(never mind|close|cancel|not now|ok|got it|back|keep playing|keep it)\b/i.test(((x.querySelector('.tx b')||x).textContent||'').trim()))||(bs.length===1?bs[0]:null);
  if(c){c.click();return true}
  el.remove();modalClosed();return true}
window.escModal=escModal;
function closeModals(){MQ=[];FOCUS_RET=null;document.querySelectorAll('.modal-bg').forEach(e=>e.remove());syncInert();setTimeout(tileFlush,0)}

// ---------------- full-screen transition ----------------
// transition('🚌','Off to work','20 minutes', done)  plays a short animation, then calls done().
// Tap to skip. Reduce-motion shortens it.
function transition(ic,cap,cap2,done,snd){
  const el=document.createElement('div');el.className='cross';el.tabIndex=0;sfx(snd||'whoosh');
  el.innerHTML=`<svg viewBox="0 0 480 260" aria-hidden="true"><rect width="480" height="260" fill="none"/><path d="M0 200 h480 M0 222 h480" stroke="#fff" stroke-opacity=".1"/>
    <text class="bob" x="240" y="150" text-anchor="middle" font-size="84">${ic}</text></svg>
    <div class="cap">${withName(cap)}</div><div class="cap2">${withName(cap2||'')}</div><div class="cap2" style="margin-top:18px">tap to skip</div>`;
  document.body.appendChild(el);el.focus();
  let fin=false;const end=()=>{if(fin)return;fin=true;el.remove();done&&done();setTimeout(tileFlush,0)};
  el.onclick=end;el.onkeydown=e=>{if(e.key==='Escape'||e.key==='Enter'||e.key===' '){e.preventDefault();end()}};
  setTimeout(end,prefs().rm?700:2200);
}

// ---------------- event tiles (toasts) ----------------
// showTile('🎉','Found $20','On the way to the park','good')   kind: good | bad | warn | info
// One tile at a time, shown just below the HUD so Cash and Rep stay readable. Extra tiles wait in a short queue (duplicates are
// dropped, the oldest goes if it grows past TILE_QUEUE) and each stays about 3.5 seconds. A tile whose title is already in an open
// (or queued) pop-up is skipped: the pop-up says it. While a pop-up (or a full-screen transition) is open, tiles wait in the queue
// and a tile already showing is hidden (CSS) and kept: they come out when the last pop-up closes. Tiles sit below the HUD, never on it.
let tileQ=[];const TILE_MAX=1,TILE_QUEUE=3,TILE_MS=3500;
const plain=h=>String(h||'').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim().toLowerCase();
function modalSays(title){
  const t=plain(withName(title));if(!t) return false;
  const open=document.getElementById('mbg');
  return (open&&plain(open.textContent).includes(t))||MQ.some(q=>plain(q[0]+' '+q[1]).includes(t));
}
function tileBox(){let el=document.getElementById('tiles');if(!el){el=document.createElement('div');el.id='tiles';el.setAttribute('role','status');el.setAttribute('aria-live','polite');document.body.appendChild(el)}return el}
// opt {decide:id}: a decision tile (03-events.js choices). The tile is a button ("Tap to decide") that opens the choice sheet;
// it stays a little longer, and a queued one is dropped once you've decided.
function showTile(ic,title,sub,kind,when,opt){
  if(!S||S.over) return;
  const dec=opt&&opt.decide;if(dec&&!choiceWaiting(dec)){tileFlush();return}
  if(DIGEST&&!DIGEST.open){DIGEST.items.push({ic,title,lines:sub?[sub]:[],kind,tile:true});return}   // a toast that would pop up while you wake: it goes in the morning report
  if(modalSays(title)) return;
  when=when||`${dayName(day()).slice(0,3)} ${fmt(S.t)}`;
  const box=tileBox();
  if(box.children.length>=TILE_MAX||tileBlocked()){
    if(!tileQ.some(q=>q[1]===title&&q[2]===sub)){tileQ.push([ic,title,sub,kind,when,opt]);while(tileQ.length>TILE_QUEUE)tileQ.shift()}
    return}
  tileTop(box);
  const t=document.createElement('div');t.className='tile '+(kind||'info');
  title=withName(title);sub=withName(sub);sfx(kind==='good'?'good':kind==='bad'?'bad':'info');
  const inner=`<span class="ti">${ic}</span><span class="tt"><small>${dec?(AMB[dec]?'A moment':'Your call'):{good:'Good news',bad:'Event',warn:'Heads up'}[kind]||'Update'} · ${when}</small><b>${title}</b>${sub?`<span>${sub}</span>`:''}</span>`;
  if(dec)t.classList.add('decide');
  t.innerHTML=dec?`<button class="tdec" aria-label="${esc(plain(title))}: ${AMB[dec]?'tap to stop and watch':'tap to decide'}">${inner}</button><button class="ok" aria-label="Later">✓</button>`:`${inner}<button class="ok" aria-label="Got it">✓</button>`;
  let gone=false;const close=tap=>{if(gone)return;
    if(tap!==true&&tileBlocked()){setTimeout(close,800);return}   // hidden behind a pop-up: keep it until the pop-up is gone
    gone=true;t.classList.add('out');setTimeout(()=>{t.remove();tileFlush()},260);
    if(dec&&AMB[dec])choiceDrop(dec)};   // an ambient moment's tile went away untapped: Keep going
  t.querySelector('.ok').onclick=()=>close(true);t.onclick=e=>{if(e.target===t)close(true)};
  if(dec)t.querySelector('.tdec').onclick=()=>{gone=true;t.remove();openChoice(dec)};
  setTimeout(close,dec?TILE_MS*2:tileQ.length>=2?TILE_MS-1200:TILE_MS);box.appendChild(t);
}
// a pop-up or a full-screen transition is up: tiles wait
function tileBlocked(){return !!(document.getElementById('mbg')||document.querySelector('.cross'))}
// show the next waiting tile, if nothing is in the way
function tileFlush(){if(!tileQ.length||tileBlocked()||!S||S.over)return;const box=document.getElementById('tiles');if(box&&box.children.length>=TILE_MAX)return;showTile(...tileQ.shift())}
// just under the HUD (the HUD is sticky, so its bottom edge is where the page content starts on screen)
function tileTop(box){const hud=document.querySelector('#app .hud');if(hud){const b=hud.getBoundingClientRect().bottom;if(b>0)box.style.top=Math.round(b+6)+'px'}}
function clearTiles(){tileQ=[];document.querySelectorAll('#tiles .tile').forEach(t=>t.remove())}
window.showTile=showTile;
// ---------------- random events ----------------
// defEvent({
//   id:'found_cash',             unique id (saved in S.ev, so don't rename casually: see MIGRATIONS)
//   hook:'arrive',               when it can fire: 'wake' | 'arrive' | 'travel' | 'night' | any name you fireHook() yourself
//                                (or an array of hooks)
//   tile:['💵','Found $20','good'],  icon, title, kind for the toast
//   chance:0.1,                  0–1, or a function (ctx)=>number
//   bad:true,                    scale chance by the difficulty's "bad" multiplier
//   cond:ctx=>S.loc==='park',    must be true to fire
//   cooldown:2,                  days before it can fire again
//   max:1,                       times per game
//   priority:0,                  higher runs first
//   run:ctx=>{ money(20); say('…'); return {stop:true} }  return {stop:true} to stop later events on this hook
// })
// chain('id') forces an event to fire the next time its hook runs (one event can set up another).
const EV=[];
function defEvent(e){EV.push(Object.assign({chance:0,priority:0,cooldown:0,max:99},e))}
let EV_RUNNING=null;
function chain(id,cause){if(!S.ev.force.includes(id))S.ev.force.push(id);S.ev.cause=S.ev.cause||{};S.ev.cause[id]=cause||EV_RUNNING||null}
window.forceEvent=id=>chain(id);
const HOOK_SCALE={wake:0.85}; // chance that a hook call lets any event through at all (15% of mornings stay quiet)
const HOOK_SUB={wake:'This morning',night:'Overnight'};
function fireHook(hook,ctx={}){
  ctx.hook=hook;let res=null;const popItems=[];
  const capped=infoPopsToday()>=INFO_POP_CAP;   // enough "OK" pop-ups today: the rest show as tiles and go in the log
  const scale=HOOK_SCALE[hook]??1,open=scale>=1||Math.random()<scale;
  const list=EV.filter(e=>e.hook===hook||(Array.isArray(e.hook)&&e.hook.includes(hook))).sort((a,b)=>b.priority-a.priority);
  for(const e of list){
    const forced=S.ev.force.includes(e.id);
    if(e.cond){let ok=false;try{ok=e.cond(ctx)}catch(err){ok=false}if(!ok)continue}
    if(!open&&!forced) continue;
    if(!forced){
      if((S.ev.count[e.id]||0)>=e.max) continue;
      if(e.choices&&(isPending(e.id)||AMB[e.id]||(!e.urgent&&!evAmbient(e,ctx)&&pendingList().length>=CHOICE_MAX))) continue;   // decisions waiting: no more choice events for now (urgent ones ask at once, and moments don't count)
      if(S.ev.last[e.id]!=null&&day()-S.ev.last[e.id]<e.cooldown) continue;
      const p=(typeof e.chance==='function'?e.chance(ctx):e.chance)*(e.bad?DF().bad:1);
      if(!(Math.random()<p)) continue;
    } else S.ev.force=S.ev.force.filter(x=>x!==e.id);
    S.ev.last[e.id]=day();S.ev.count[e.id]=(S.ev.count[e.id]||0)+1;S.ev.history.push({id:e.id,t:S.t});
    const nBefore=uiNarr.length,mBefore=MQ.length+(document.getElementById('mbg')?1:0);
    if(Array.isArray(ctx.fired))ctx.fired.push(e.id);   // the caller can ask which events ran (endDay: the morning report's picture)
    EV_RUNNING=e.id;let r;try{r=(e.run?e.run(ctx):null)||{}}finally{EV_RUNNING=null}
    // events that didn't open their own modal get collected into one OK pop-up per hook call
    const ownModal=MQ.length+(document.getElementById('mbg')?1:0)!==mBefore;
    if(e.choices){   // a decision: its own tile or sheet (choiceFired), not the OK pop-up
      choiceFired(e,ctx,uiNarr.slice(nBefore),forced);
      if(S.ev.cause)delete S.ev.cause[e.id];
      if(ctx.notes) ctx.notes.push(...uiNarr.slice(nBefore));
      if(r.stop){res=r;break}
      res=res||r;continue}
    if(!ownModal) popItems.push({e,lines:uiNarr.slice(nBefore)});
    const [ic,title,kind]=e.tile||['📍',e.id.replace(/_/g,' '),'info'];
    const dup=ownModal||hook==='night'||!!DIGEST||(popupsOn()&&!capped);   // the event's own modal, the night summary or the OK pop-up already tells the player
    const cause=S.ev.cause&&S.ev.cause[e.id],ce=cause&&EV.find(x=>x.id===cause);
    if(!dup)showTile(ic,title,ce?`Because of: ${ce.tile?ce.tile[1]:cause}`:(ctx.sub||HOOK_SUB[hook]||''),kind,hook==='night'?`${dayName(day()).slice(0,3)} night`:null);
    if(S.ev.cause)delete S.ev.cause[e.id];
    if(ctx.notes) ctx.notes.push(...uiNarr.slice(nBefore));
    if(r.stop){res=r;break}
    res=res||r;
  }
  eventPopup(hook,popItems,capped);
  if(popItems.length&&hook!=='night'&&!DIGEST&&!(popupsOn()&&!capped)) artNarrEvent(popItems.map(it=>it.e.id));   // 40-art.js: no pop-up, so its picture goes over the narration
  return res;
}
// ---- OK pop-up for events (on by default; Settings → Event pop-ups) ----
const POPUP_KEY=KEY('popups');
// (1.12.0: off unless you turn it on. The morning report and decisions still pop up; the rest is a tile and a log line.)
function popupsOn(){try{return localStorage.getItem(POPUP_KEY)==='on'}catch(e){return false}}
// At most INFO_POP_CAP of these information-only pop-ups a day (decisions and the night summary are never counted or held back).
const INFO_POP_CAP=1;
function infoPopsToday(){const p=S&&S.ev&&S.ev.pop;return p&&p.d===day()?p.n:0}
function eventPopup(hook,items,capped){
  if(!items.length||hook==='night'||!S||S.over) return;
  if(DIGEST){items.forEach(it=>{const m=it.e.tile||['📍',it.e.id.replace(/_/g,' ')];DIGEST.items.push({ic:m[0],title:m[1],lines:it.lines,id:it.e.id})});return}   // morning events are part of the morning report
  if(!popupsOn()||capped) return;
  S.ev.pop={d:day(),n:infoPopsToday()+1}; // night events go in the "Good night" summary
  const meta=e=>e.tile||['📍',e.id.replace(/_/g,' ')];
  const body=items.map(it=>{const m=meta(it.e);const txt=it.lines.map(l=>`<p style="margin:4px 0 0">${l}</p>`).join('');
    return items.length>1?`<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)"><span style="font-size:24px">${m[0]}</span><div><b>${m[1]}</b>${txt}</div></div>`:txt}).join('');
  const one=items.length===1?meta(items[0].e):null;
  const art=artOn()?artFirst(items.map(it=>()=>artSlot('event',()=>artEventCtx(it.e.id,'game'),{deco:true}))):'';   // 40-art.js: the first event with an illustration
  modal(one?`${one[0]} ${one[1]}`:'📍 Meanwhile…',art+(body||'<p></p>'),[{l:'OK',fn:()=>{}}]);
}

// ---------------- choices: events that ask you to decide ----------------
// An event may add, besides run:
//   choices:()=>[{ic:'🚌',l:'Sit up front',s:'Lose less if something happens',fn:()=>{…},dis:false}, …]   2–3 options, built when it fires
//   dflt:1          the option applied if you never decide by the end of the day (the cautious or "pass" one)
//   urgent:true     opens the choice sheet at once, even with pop-ups off (setbacks that can't wait)
// When it fires: run() runs, a pending decision goes in S.ev.pending ({id,day,title,ic,lines,hook,urgent}), and its tile says
// "Tap to decide". The sheet opens from the tile, the Decide card on the Here tab, or the morning report. At night, anything still
// pending gets its dflt option ("You let it go: …"). At most CHOICE_MAX pending (urgent ones aside: they ask at once): further choice events don't fire (a forced one takes
// its default at once). Saves keep S.ev.pending; the options are rebuilt from the event after a reload.
// An urgent event on the night hook goes at the top of the morning report and its sheet opens right after the report closes.
// Ambient moments (choices from stopWatch, whose array carries .ambient) never take a pending slot: they live in AMB (not saved)
// while their tile shows. The tile is tappable for its lifetime; once it goes (or at night) "Keep going" is applied silently.
const CHOICE_MAX=3;
const AMB={};   // id → {id,title,ic,lines,hook}: ambient moments you can still stop for
function evAmbient(e,ctx){   // does this event's choices() come from stopWatch? (probed once, then cached on the event)
  if(e._amb!==undefined)return e._amb;
  try{const o=e.choices(Object.assign({},ctx,{probe:true}));e._amb=!!(o&&o.ambient)}catch(err){return false}
  return e._amb}
const choiceWaiting=id=>isPending(id)||!!AMB[id];
window.choicesWaiting=()=>pendingList().map(p=>p.id).concat(Object.keys(AMB));
const untag=h=>String(h||'').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
const CHOICE_CACHE={};   // id → {ctx, opts}: the options as built when the event fired (not saved; rebuilt after a reload)
function eventFlag(id){return S&&S.ev&&S.ev.flags?S.ev.flags[id]:undefined}
function setEventFlag(id,v){S.ev.flags=S.ev.flags||{};S.ev.flags[id]=v===undefined?true:v}
// The standard two options for an ambient moment: "👀 Stop and watch" (time → calm, maybe energy/community) or "Keep going" (nothing).
// Use with dflt:1.
function stopWatch(o={}){
  const mins=o.mins??15,cv=o.calm??6,en=o.energy||0,co=o.community||0,grow=typeof isGrow==='function'&&isGrow();
  const bits=[`${mins} min`];
  if(cv)bits.push(grow?`mood +${cv}`:(typeof calmTxt==='function'?calmTxt(cv):`stress −${cv}`));
  if(en)bits.push(`energy ${en>0?'+':'−'}${Math.abs(en)}`);
  if(co&&!grow)bits.push(`community +${co}`);
  const r=[
    {ic:'👀',l:'Stop and watch',s:bits.join(', ').replace(/^./,c=>c.toUpperCase())+'.',fn:()=>{
      pass(mins);
      if(cv){if(grow)adj('mood',cv);else if(typeof calm==='function')calm(cv);else adj('stress',-cv)}
      if(en&&'energy' in S)adj('energy',en);
      if(co&&!grow&&'community' in S)adj('community',co);
      if(o.text)say(o.text)}},
    {ic:'🚶',l:'Keep going',s:o.pass||'No time spent. The moment goes on without you.',fn:()=>{}}];
  r.ambient=true;return r;
}
function pendingList(){if(!S.ev.pending)S.ev.pending=[];return S.ev.pending}
const isPending=id=>pendingList().some(p=>p.id===id);
// The options for a pending decision (from the cache, or rebuilt from the event)
function choiceOpts(id){
  const e=EV.find(x=>x.id===id);if(!e||!e.choices)return null;
  let c=CHOICE_CACHE[id];
  if(!c){let opts=[];try{opts=e.choices({hook:(pendingList().find(p=>p.id===id)||{}).hook,reload:true})||[]}catch(err){opts=[]}c=CHOICE_CACHE[id]={opts}}
  return c.opts;
}
function choiceDflt(id){const e=EV.find(x=>x.id===id),o=choiceOpts(id)||[];
  let d=e&&typeof e.dflt==='function'?e.dflt():e&&e.dflt;d=Number.isInteger(d)&&o[d]?d:o.length-1;
  if(o[d]&&o[d].dis){const k=o.findIndex(x=>!x.dis);if(k>=0)d=k}
  return d}
// Called by fireHook for an event with choices, after its run()
function choiceFired(e,ctx,lines,forced){
  let opts=[];EV_RUNNING=e.id;try{opts=e.choices(ctx)||[]}catch(err){opts=[]}finally{EV_RUNNING=null}
  if(!opts.length)return;
  const [ic,title]=e.tile||['📍',e.id.replace(/_/g,' ')];
  CHOICE_CACHE[e.id]={ctx,opts};
  const P=pendingList();
  if(opts.ambient){e._amb=true;   // a moment: no pending slot
    if(ctx.hook==='night'){choiceDrop(e.id);return}   // nobody is out to see it
    AMB[e.id]={id:e.id,title,ic,lines:lines.slice(0,4),hook:ctx.hook,amb:true};
    if(DIGEST){DIGEST.items.push({ic,title,lines,amb:e.id});return}   // the morning report offers it (morningReport)
    if(popupsOn())openChoice(e.id);
    else showTile(ic,title,'Tap to stop and watch',e.tile?e.tile[2]:'good',null,{decide:e.id});
    return}
  if(isPending(e.id)||(!e.urgent&&P.length>=CHOICE_MAX)){   // forced past the limit: it takes its default now
    if(!isPending(e.id)){P.push({id:e.id,day:day(),title,ic,lines,hook:ctx.hook});choiceApply(e.id,choiceDflt(e.id),'full')}
    return}
  P.push({id:e.id,day:day(),title,ic,lines:lines.slice(0,4),hook:ctx.hook,urgent:!!e.urgent});
  const now=ctx.hook!=='night'&&(e.urgent||popupsOn());
  if(DIGEST){DIGEST.items.push({ic,title,lines:lines.concat([e.urgent?'You need to decide this one now.':'Decide below, or it waits until tonight.'])});if(now)openChoice(e.id);return}
  if(now)openChoice(e.id);
  else if(ctx.hook!=='night')showTile(ic,title,'Tap to decide',e.tile?e.tile[2]:'info',null,{decide:e.id});
}
// Apply option i of a pending decision. how: 'pick' (you chose), 'night' (defaulted), 'full' (too many pending)
function choiceApply(id,i,how){
  const P=pendingList(),k=P.findIndex(p=>p.id===id),amb=k<0&&AMB[id];if(k<0&&!amb)return false;
  const opts=choiceOpts(id)||[],o=opts[i];
  if(amb)delete AMB[id];else P.splice(k,1);delete CHOICE_CACHE[id];
  if(!o)return false;
  const p0=S.ev.choiceLog||(S.ev.choiceLog={});p0[id]=i;   // the last option taken for each event (follow-ups can read it)
  EV_RUNNING=id;try{o.fn&&o.fn()}catch(err){console.error(err)}finally{EV_RUNNING=null}
  return true;
}
// Open the choice sheet for a pending decision (one sheet at a time: it queues behind any open pop-up)
function openChoice(id){
  const p=pendingList().find(x=>x.id===id)||AMB[id];if(!p)return;
  const opts=choiceOpts(id);if(!opts||!opts.length){if(p.amb)delete AMB[id];else pendingList().splice(pendingList().indexOf(p),1);return}
  const d=choiceDflt(id),e=EV.find(x=>x.id===id),urgent=!!(e&&e.urgent&&!p.amb);
  const body=`<div class="choice-sheet" data-ev="${esc(id)}" data-dflt="${d}" hidden></div>`+(p.lines||[]).map(l=>`<p>${l}</p>`).join('')+
    (p.amb?'':`<p class="ch-q">What do you do?</p>`+(urgent?'':`<p class="ch-note">If you don’t decide by tonight: ${esc(untag(opts[d].l))}.</p>`));
  const btns=opts.map((o,i)=>({l:`${o.ic?o.ic+' ':''}${o.l}`,s:o.s||'',dis:!!o.dis,np:true,fn:()=>{if(!choiceWaiting(id))return;uiNarr=[];choiceApply(id,i,'pick');afterAction()}}));
  if(!urgent&&!p.amb)btns.push({l:'Not now',s:'It waits on the Here tab until tonight.',fn:()=>{}});
  modalSwap(`${p.ic} ${p.title}`,body,btns,urgent);
}
window.openChoice=openChoice;
// The default option of the open choice sheet (for bots and tests), or −1 when no choice sheet is open
window.choiceBtn=()=>{const m=document.getElementById('mbg'),c=m&&m.querySelector('.choice-sheet');return c?+c.dataset.dflt:-1};
// Night: every decision still pending takes its default. Lines go to notes (the morning report) and the log.
// A moment that passed without you: "Keep going", silently
function choiceDrop(id){if(!AMB[id]){delete CHOICE_CACHE[id];return}choiceApply(id,choiceDflt(id),'gone')}
window.choiceDrop=choiceDrop;
function choiceNight(notes){
  Object.keys(AMB).forEach(choiceDrop);
  const P=pendingList().slice();
  for(const p of P){const opts=choiceOpts(p.id)||[],d=choiceDflt(p.id),o=opts[d];
    const n0=uiNarr.length,l0=S.log.length;
    S.log.push({t:S.t,s:`⏳ You let it go: ${p.ic} ${p.title}${o?` (${o.ic?o.ic+' ':''}${untag(o.l)})`:''}.`});
    choiceApply(p.id,d,'night');
    if(notes){notes.push(`⏳ You let it go: <b>${p.title}</b>${o?`. ${o.ic?o.ic+' ':''}${o.l}`:''}.`);notes.push(...uiNarr.slice(n0))}
    void l0}
}
// The Decide card at the top of the Here tab (05-ui.js) and the morning report's list
function choiceCard(btn){
  const P=pendingList();if(!P.length)return '';
  return `<div class="decide" role="region" aria-label="Decisions waiting"><div class="sect">🤔 Decide · ${P.length} waiting</div>`+
    P.map(p=>btn({ic:p.ic,l:p.title,s:p.urgent?'Decide now.':'Tap to decide. If you don’t, the cautious choice is made tonight.',cls:'decide-btn',fn:()=>openChoice(p.id)})).join('')+'</div>';
}
// ---------------- the game loop ----------------
// Time only moves when the player does something. An action calls pass(minutes); travel calls go(dest);
// sleeping calls endDay(where). After every tap the engine checks for a loss and for staying up past midnight.
//
// Your content (20-world.js, 21-story.js) provides these functions:
//   newState()            the game-specific part of S (stats, inventory…)
//   onNewGame()           intro narration / welcome modal
//   onMorning(d)          start of each day
//   onNight(where,notes,d)  end of each day: eat, pay, recover… push lines to notes for the night summary
//   onTime(min)           (optional) runs every time minutes pass: hunger, timers, deliveries
//   onArrive(dest,from)   (optional) after travel
//   travelMins(from,to)   minutes between two places
//   checkLoss()           return a LOSSES key to end the game, or null

// The engine's half of S. Content fields from newState() are merged on top.
function baseState(){
  return Object.assign({name:profileName()||GAME.defaultName,diff:'normal',t:GAME.wake,cur:0,loc:GAME.startLoc,alarm:GAME.wake,
    log:[],prios:[],tips:{seen:[]},over:false,daily:null,achGame:[],stats:{},
    ev:{last:{},count:{},history:[],force:[],flags:{},pending:[]}},newState());
}
function newGame(diff){
  clearTiles();closeModals();
  for(const k in AMB)delete AMB[k];
  S=baseState();S.diff=DIFFS[diff]?diff:'normal';
  if(typeof DF().money==='number'&&'money' in S) S.money=DF().money;
  uiNarr=[];tab='act';
  onNewGame();
  startDay();
}

  const newer=typeof d.app==='string'&&verCmp(d.app,APP_VERSION)>0?d.app:null;
  if(from>SAVE_SCHEMA&&!newer) notes.push(`this save is from a newer version (${d.app||'unknown'}). Anything this version doesn’t know about is kept but ignored`);
  else if(from<SAVE_SCHEMA) notes.push(`upgraded from an older version${d.app?' ('+d.app+')':''}`);
  const tabs=allTabs().map(t=>t[0]);
  return {schema:Math.max(from,SAVE_SCHEMA),app:d.app,S:x,uiNarr:Array.isArray(d.uiNarr)?d.uiNarr:[],tab:tabs.includes(d.tab)?d.tab:'act',at:d.at,notes,newer};

function rawSave(n){const ls=store();if(!ls)return null;let best=null;
  for(const k of slotKeys(n)){const v=ls.getItem(k);if(!v)continue;let at=0;try{at=JSON.parse(v).at||0}catch(e){}if(!best||at>best.at)best={k,v,at}}
  return best}

  const r=rawSave(n);if(!r)return null;
  try{const d=migrate(JSON.parse(r.v));return d.S.over?null:d}
  catch(e){ // set an unreadable save aside instead of crashing on it forever
    try{const ls=store(),sn=n||curSlot();ls.setItem(KEY('save.broken'+(sn>1?'.slot'+sn:'')),r.v);slotKeys(sn).forEach(k=>ls.removeItem(k))}catch(_){}
    saveNotice='Your saved game couldn’t be read, so it was set aside. Start a new game.';return null}
}
function adopt(d){
  S=d.S;uiNarr=d.uiNarr;tab=d.tab;for(const k in AMB)delete AMB[k];
  render();
  if(d.newer&&newerWarned!==d.newer){newerWarned=d.newer;modal('⚠️ Save from a newer version',`<p>This save is from ${esc(GAME.title)} ${esc(d.newer)}, newer than this copy (${APP_VERSION}). Update to keep everything: whatever this copy doesn’t know about is ignored, and may be lost if you keep playing here.</p>`,[{l:'Continue anyway',fn:()=>{}}])}

function b64enc(str){return btoa(unescape(encodeURIComponent(str)))}
function b64dec(b){return decodeURIComponent(escape(atob(b)))}

  <button class="act" style="margin-top:6px" onclick="copyCode()"><span class="tx"><b id="cpl">📋 Copy code</b></span></button>`:'<p><i>No game in progress to export.</i></p>'}

function importCode(){
  const raw=(window.IMPV||document.getElementById('imp')?.value||'').trim();window.IMPV='';

// ---- ⌨️ keyboard shortcuts (desktop) ----
// 1–9 press the numbered buttons (in a pop-up, its buttons; otherwise the action buttons on screen),
// a tab's first letter switches to it (H Here, T To-do, L Log…), Esc closes, ? lists all of this.
// Number hints only show on a computer with a mouse (CSS: hover + fine pointer), and never while typing.
const KEY_CLOSE=/^(never mind|close|cancel|not now|ok|got it|back|keep playing|keep it)\b/i;
const keyTabs=()=>{const m={};allTabs().forEach(([k,,l])=>{const c=l[0].toLowerCase();if(!m[c])m[c]=k});return m};
const keyVisible=el=>!!el&&!el.disabled&&el.offsetParent!==null&&el.getClientRects().length>0;
function keyTargets(){
  const mb=document.getElementById('mbg');
  if(mb) return {where:'modal',list:[...mb.querySelectorAll('.modal > button.act')].filter(keyVisible)};
  if(document.querySelector('.cross'))return {where:'none',list:[]};
  if(typeof S==='undefined'||!S||S.over||!document.querySelector('#app .hud'))return {where:'none',list:[]};
  return {where:'main',list:tab==='act'?[...document.querySelectorAll('#app .content button.act')].filter(keyVisible):[]}}
function keyHints(){try{
  document.querySelectorAll('.kn').forEach(n=>n.remove());
  const {list}=keyTargets();list.slice(0,9).forEach((b,i)=>{const n=document.createElement('i');n.className='kn';n.setAttribute('aria-hidden','true');n.textContent=i+1;b.appendChild(n)})}catch(e){}}
function keysModal(back){
  const row=(k,t)=>`<div class="keys-row"><kbd>${k}</kbd><span>${t}</span></div>`;
  const tabs=Object.entries(keyTabs());
  modal('⌨️ Keyboard shortcuts',`<div class="keys">${[
    row('1 – 9','Press the numbered button (the small number on its right)'),
    row(tabs.map(([c])=>c.toUpperCase()).join(' '),tabs.map(([,k])=>allTabs().find(t=>t[0]===k)[2]).join(', ')+' tabs'),
    row('Esc','Close the pop-up; skip a transition'),
    row('Enter','Press the highlighted button'),
    row('?','This list')].join('')}</div><p style="font-size:12px;color:var(--mute)">Shortcuts never fire while you’re typing.</p>`,
    (back?[{l:'Back to settings',fn:back}]:[]).concat([{l:'Close',fn:()=>{}}]))}
window.keysModal=keysModal;
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;
  const t=e.target;if(t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable))return;
  const k=e.key,lk=k.length===1?k.toLowerCase():k;
  if(k==='?'){e.preventDefault();if(!document.getElementById('mbg'))keysModal();return}
  const {where,list}=keyTargets();
  if(/^[1-9]$/.test(k)){const b=list[+k-1];if(b){e.preventDefault();b.click()}return}
  if(where==='modal'){
    if(k==='Escape'){e.preventDefault();escModal()}
    return}
  if(where!=='main')return;
  const kt=keyTabs();if(kt[lk]){e.preventDefault();setTab(kt[lk])}
});
// refresh the hints whenever the screen or a pop-up changes
{let q=false;const go=()=>{q=false;keyHints()};
  try{new MutationObserver(ms=>{if(q)return;if(ms.some(m=>[...m.addedNodes].some(n=>n.nodeType===1&&!n.classList.contains('kn'))||[...m.removedNodes].some(n=>n.nodeType===1&&n.id==='mbg'))){q=true;requestAnimationFrame(go)}})
    .observe(document.body,{childList:true,subtree:true})}catch(e){}}

// Minutes between places (symmetric). The house is one building; everything else is a short drive.
const TRAVEL={'oldtown|fredmeyer':12,'oldtown|mall':12,'oldtown|nature':10,'fredmeyer|mall':14,'fredmeyer|nature':12,'mall|nature':16};
const FROM_HOUSE={oldtown:12,fredmeyer:10,mall:15,nature:18};
function travelMins(a,b){
  if(a===b) return 0;
  if(atHouse(a)&&atHouse(b)) return a==='garage'||b==='garage'?2:1;
  if(atHouse(a)) return FROM_HOUSE[b]||15;
  if(atHouse(b)) return FROM_HOUSE[a]||15;
  return TRAVEL[a+'|'+b]??TRAVEL[b+'|'+a]??15;
}

// ---- actions ----
// Each: {ic, l, s, fn, cat (an ACT_CATS key), cls:'primary'|'danger', dis:true}. fn changes S, calls pass(min) and say('…').
let ACT_CATS={event:'🦃 Right now',fam:'👪 Family',chores:'📋 Chores',food:'🍽️ Food',pie:'🥧 The pie',shop:'🛍️ Shopping',rest:'🛋️ Rest & recharge',here:'📍 Around here'};
// talk to a family member: once a day each, a heart and a little charm
function talkAct(id){
  const F=FAMILY[id],k='talk_'+id,h=S.fam[id];
  return {ic:F.ic,l:id==='biscuit'?'Make friends with Biscuit':`Talk with ${F.n}`,s:did(k)?'You’ve already talked today. Try again tomorrow.':`20 min. ${hearts(id)}${h<3?' A heart and charm +2.':' Charm +1.'}`,cat:'fam',dis:did(k),
    fn:()=>{mark(k);pass(20);S.stats.talks++;say(F.lines[Math.min(h,3)]);heart(id,h<3?2:1);if(id==='biscuit')calm(4);if(id==='tanner'||id==='dez')weird(2);fireHook('talk',{who:id,sub:`With ${F.n}`})}};
}
// Riley: once a day, anywhere at the house
function rileyAct(){
  return {ic:'💞',l:'Check in with Riley',s:did('riley')?'You already had your moment today.':'15 min. A quiet “you okay?” in the hallway. Riley +8, stress −4.',cat:'fam',dis:did('riley'),
    fn:()=>{mark('riley');pass(15);adj('riley',8);adj('stress',-4);say(pick(['💞 Riley squeezes your hand. “You’re doing great. Grandma moved her chair closer to you. That’s huge.”','💞 You and Riley hide behind the coat closet for one full minute of peace. Best minute of the day.','💞 Riley whispers, “I told you they were weird.” You whisper, “You undersold it.” You both laugh too loud.']))}};

function choreAct(){

    fn:()=>{S.chores[d]=n+1;S.stats.chores++;pass(40);adj('energy',-10);adj('charm',4);adj('stress',2);if(S.chores[d]===CHORE_MAX&&S.fam.linda<3)S.fam.linda++;
      say(pick(['📋 You fold 40 napkins into swans. Linda inspects one, holds it to the light, and puts a check on the clipboard.','📋 You peel eleven pounds of potatoes. Biscuit supervises in a tiny chef’s hat.','📋 You polish the “good silver,” which is reserved for Thanksgiving and one funeral in 2004.','📋 You label the leftover containers. Linda has a label maker. It has a font setting called “Firm.”','📋 You move the folding chairs from the garage. Dez makes you promise not to look at the clocks.'])+(S.chores[d]===CHORE_MAX?' Linda gives you a curt nod: a ❤️ from Linda.':''))}};

function worldWait(){
  const m=tod(),o=[30,60,120].filter(x=>m+x<1439);
  modal('⏳ Wait a while',`<p style="font-size:13px;color:var(--mute)">It’s ${fmt(S.t)}. Time passes and nothing else happens.</p>`,
    o.map(x=>({l:`${x} minutes`,s:`Until ${fmt(S.t+x)}.`,fn:()=>{pass(x);say(`⏳ You wait ${x} minutes in ${L[S.loc].name.replace(/^The /,'the ')}.`)}})).concat([{l:'Never mind',fn:()=>{}}]));
}

function stScene(k){

  const steps=k==='dinner'?dinnerSteps():gamesSteps();let i=0;

const TRIVIA=[
  {k:'dez',q:'What did Uncle Dez name his radio show?',a:['Dez After Dark','The Frequency Files','Garage Waves'],c:1},
  {k:'gary',q:'What has Gary deep-fried, besides turkey?',a:['A whole birthday cake','A watermelon','A pickle the size of a forearm'],c:0},

function gamesSteps(){
  S.games.pts=0;const pt=()=>{S.games.pts++;say('🏅 A point for your team!')};
  const q=TRIVIA.slice().sort(()=>Math.random()-0.5).slice(0,2);

    opts:()=>t.a.map((a,j)=>({l:`${S.fam[t.k]>=1&&j===t.c?'💡 ':''}${a}`,s:'',fn:()=>{if(j===t.c){pt();stHeart(t.k)}else say(`❌ The answer was “${t.a[t.c]}.” ${FAM_N[t.k]} looks a little hurt.`)}}))});
  return [
    {t:'The Family Games: charades',body:()=>`<p>2:00 PM. ${S.games.late?'You slide in late. ':''}Teams: you and Riley and Tanner against Grandma, Dez and Bev. Gary keeps score on Linda’s clipboard. Your card says: <b>“TURKEY FRYER.”</b></p>`,
      opts:()=>[
        {l:'🔥 Go big: become the fryer',s:'Full commitment. Likely a point. Energy −6.',fn:()=>{adj('energy',-6);if(Math.random()<0.75){pt();stHeart('gary');say('🔥 You bubble. You hiss. You mime a fire extinguisher. Riley yells “FRYER!” Gary is very moved.')}else say('🔥 Tanner guesses “jacuzzi.” Time.')}},
        {l:'🦃 Act out a turkey, then point at the driveway',s:'Clever. A fair chance.',fn:()=>{if(Math.random()<0.55){pt();say('🦃 Riley gets it from the driveway point. Teamwork.')}else say('🦃 “Biscuit?” Biscuit, hearing his name, runs in. Time.')}},
        {l:'😶 Stand still and make a small bubbling noise',s:'Low effort. Low odds. Stress −2.',fn:()=>{stCalm(2);if(Math.random()<0.25){pt();say('😶 Somehow Dez on the OTHER team shouts it. Gary rules it counts.')}else say('😶 Silence. A doll upstairs probably understood.')}}]},
    trivia(q[0]),trivia(q[1]),
    {t:'The final round: Grandma',body:()=>`<p>Score: you ${S.games.pts}, Grandma’s team ${Math.max(0,3-S.games.pts)}. The last point is a head-to-head speed round against <b>Grandma Marjorie</b>. She cracks her knuckles.</p>`,
      opts:()=>[
        {l:'🏃 Go for it',s:'You might win. Grandma respects a fighter.',fn:()=>{if(Math.random()<0.5){pt();stHeart('marjorie');say('🏃 You win by half a second. Grandma shakes your hand like a coach.')}else say('🏃 Grandma wins. She does a small, dignified fist pump.')}},

}
function gamesEnd(){
  const g=S.games;g.done=true;g.won=g.pts>=3;stPass(60);
